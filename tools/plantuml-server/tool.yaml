id: plantuml-server
name: PlantUML Server
summary: Run a local PlantUML server that renders diagrams on localhost:8085.
description: |
  Starts the official PlantUML server (Jetty image, Graphviz included) bound to
  `127.0.0.1:8085`, so only this machine can reach it and diagram source stays local.
  The GitLab PlantUML Viewer extension expects it at exactly this address.

  Start it from here when you need it; the launcher doesn't restart it after a reboot.
  Open `http://localhost:8085` to check it's running, or to use its built-in editor.
kind: docker
tags: [plantuml, diagrams, docker]
repository: https://github.com/plantuml/plantuml-server
added: "2026-10-27"

requires:
  - { tool: docker }

source:
  type: docker
  image: plantuml/plantuml-server
  tag: jetty

install:
  type: docker-pull

run:
  - name: Start PlantUML server on localhost:8085
    type: docker
    ports: ["127.0.0.1:8085:8080"]
  - { name: Open PlantUML editor, type: url, url: "http://localhost:8085" }

links:
  - { label: PlantUML Server, url: "https://github.com/plantuml/plantuml-server" }
  - { label: PlantUML language reference, url: "https://plantuml.com/" }
