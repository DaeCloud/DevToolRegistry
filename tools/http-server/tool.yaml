id: http-server
name: http-server
summary: Zero-config static file server for quick local testing.
description: |
  Serves a folder over HTTP with one command: handy for checking a built SPA, static
  site or a set of files in a browser. Installed as a global npm package; the run profile
  opens a terminal serving the current folder on port 8080.
kind: cli
tags: [web, node]
repository: https://github.com/http-party/http-server
added: "2026-10-27"
requires:
  - { tool: node, version: ">=18" }
source:
  type: npm
  package: http-server
install:
  type: npm-global
detect:
  command: http-server --version
run:
  - { name: Serve current folder, type: terminal, command: http-server . -p 8080 }
  - { name: Open localhost:8080, type: url, url: "http://localhost:8080" }
