id: dozzle
name: Dozzle
summary: Real-time log viewer for your local Docker containers.
description: |
  A lightweight web UI that streams the logs of every container on your Docker engine,
  with search and multi-container views. It reads the Docker socket, so it sees all
  containers, including the ones the launcher starts.
kind: docker
tags: [docker, logging]
repository: https://github.com/amir20/dozzle
added: "2026-10-27"

requires:
  - { tool: docker }

options:
  - { id: port, label: Web UI port, type: port, default: "8888" }

source:
  type: docker
  image: amir20/dozzle
  tag: latest

install:
  type: docker-pull

run:
  - name: Start Dozzle on localhost:${port}
    type: docker
    ports: ["127.0.0.1:${port}:8080"]
    volumes: ["//var/run/docker.sock:/var/run/docker.sock"]
  - { name: Open Dozzle, type: url, url: "http://localhost:${port}" }

links:
  - { label: Dozzle Documentation, url: "https://dozzle.dev/" }
