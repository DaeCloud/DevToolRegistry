id: lazygit
name: lazygit
summary: Terminal UI for git that makes staging, rebasing and stashing quick.
description: |
  A keyboard-driven git UI in the terminal: stage individual lines, interactively rebase,
  cherry-pick, resolve conflicts and manage stashes without memorising flags. Installed
  through winget.
kind: cli
tags: [git, tui]
repository: https://github.com/jesseduffield/lazygit
added: "2026-10-27"
requires:
  - { tool: winget }
source:
  type: winget
  id: JesseDuffield.lazygit
install:
  type: winget
detect:
  command: lazygit --version
  pattern: 'version=([0-9.]+)'
run:
  - { name: Open in terminal, type: terminal, command: lazygit }
