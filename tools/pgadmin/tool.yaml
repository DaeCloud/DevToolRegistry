id: pgadmin
name: pgAdmin
summary: Web admin UI for PostgreSQL, running locally in Docker.
description: |
  pgAdmin 4 in desktop mode (no login screen) on localhost. To connect to the launcher's
  PostgreSQL, add a server with host `postgres`, port `5432`, user `postgres` and the
  password you set for PostgreSQL. For a database outside Docker use
  `host.docker.internal`.
kind: docker
tags: [database, docker, postgres, admin]
homepage: https://www.pgadmin.org
added: "2026-10-27"

requires:
  - { tool: docker }

options:
  - { id: port, label: Web UI port, type: port, default: "5050" }
  - { id: email, label: Admin email, default: dev@pgadmin.org, description: Required by the image even in desktop mode. }
  - { id: password, label: Admin password, type: password, default: admin }

source:
  type: docker
  image: dpage/pgadmin4
  tag: latest

install:
  type: docker-pull

run:
  - name: Start pgAdmin on localhost:${port}
    type: docker
    ports: ["127.0.0.1:${port}:80"]
    volumes: ["pgadmin-data:/var/lib/pgadmin"]
    dockerArgs: ["--add-host", "host.docker.internal:host-gateway"]
    env:
      PGADMIN_DEFAULT_EMAIL: ${email}
      PGADMIN_DEFAULT_PASSWORD: ${password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
  - { name: Open pgAdmin, type: url, url: "http://localhost:${port}" }

links:
  - { label: pgAdmin container docs, url: "https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html" }
