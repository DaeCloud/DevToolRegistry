id: nginx-proxy-manager
name: Nginx Proxy Manager
summary: Reverse proxy with a web UI for hostnames, SSL certificates and access lists.
description: |
  Nginx with a friendly admin UI for proxy hosts, redirection, streams and Let's Encrypt
  or custom certificates. Because it joins the launcher's `devtool-net` network, a proxy
  host can forward straight to other launcher containers by id (e.g. `it-tools:80`).

  Open the admin UI and sign in. Older releases use `admin@example.com` / `changeme`
  and force a change; newer ones ask you to create the admin account on first visit.

  Ports bind to 127.0.0.1 by default. Choose 0.0.0.0 for "Listen on" to reach it from
  other machines. Windows often has something on port 80 already (IIS, http.sys);
  Configure will warn you and you can pick other ports. The container is kept and
  restarts with Docker unless you stop it.
kind: docker
tags: [docker, proxy, nginx, ssl]
homepage: https://nginxproxymanager.com
repository: https://github.com/NginxProxyManager/nginx-proxy-manager
added: "2026-10-27"

requires:
  - { tool: docker }

options:
  - { id: bind, label: Listen on, type: select, default: 127.0.0.1, choices: ["127.0.0.1", "0.0.0.0"], description: 127.0.0.1 is this machine only. }
  - { id: httpPort, label: HTTP port, type: port, default: "80" }
  - { id: httpsPort, label: HTTPS port, type: port, default: "443" }
  - { id: adminPort, label: Admin UI port, type: port, default: "81" }

source:
  type: docker
  image: jc21/nginx-proxy-manager
  tag: latest

install:
  type: docker-pull

run:
  - name: Start Nginx Proxy Manager
    type: docker
    ports: ["${bind}:${httpPort}:80", "${bind}:${httpsPort}:443", "127.0.0.1:${adminPort}:81"]
    volumes: ["npm-data:/data", "npm-letsencrypt:/etc/letsencrypt"]
    restart: unless-stopped
  - { name: Open admin UI, type: url, url: "http://localhost:${adminPort}" }

links:
  - { label: Documentation, url: "https://nginxproxymanager.com/guide/" }
