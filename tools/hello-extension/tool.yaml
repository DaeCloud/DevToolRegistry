id: hello-extension
name: Hello Extensions (sample)
summary: Chrome's hello-world extension, installed straight from repo files with no release or zip.
description: |
  Sample entry showing a **browser extension loaded from a repo's plain files**. The launcher
  fetches just the `functional-samples/tutorial.hello-world` folder at the latest commit on
  `main`, copies it to a stable folder for "Load unpacked", and offers an update whenever that
  branch gets a new commit.

  For your own extension, point `source` at your repo:
  - `github-repo` (GitHub API, supports private repos via `auth`)
  - `gitlab-repo` (GitLab API, `host` for self-hosted)
  - `git` (any remote via the git CLI and your credential manager, e.g. Azure DevOps)
kind: browser-extension
tags: [browser, sample]
repository: https://github.com/GoogleChrome/chrome-extensions-samples
readme: https://raw.githubusercontent.com/GoogleChrome/chrome-extensions-samples/main/README.md
added: "2026-10-27"
source:
  type: github-repo
  repo: GoogleChrome/chrome-extensions-samples
  ref: main
install:
  type: browser-extension
  path: functional-samples/tutorial.hello-world
links:
  - { label: Tutorial, url: "https://developer.chrome.com/docs/extensions/get-started/tutorial/hello-world" }
