id: mariadb
name: MariaDB
summary: Run a local MariaDB database server from the official image.
description: |
  Starts MariaDB on localhost and stores database files in a persistent Docker volume.
  Other launcher containers reach it as `mariadb:3306`. The root password is for local
  development only.

  This replaces the earlier Bitnami-based entry: Bitnami moved its free Docker Hub
  images to `bitnamilegacy` in August 2025, so `bitnami/mariadb:latest` is no longer
  maintained. Data from the Bitnami volume isn't reused (different layout).
kind: docker
tags: [database, docker, mariadb, mysql]
repository: https://github.com/MariaDB/mariadb-docker
added: "2026-10-27"

requires:
  - { tool: docker }

options:
  - { id: port, label: Host port, type: port, default: "3306" }
  - { id: password, label: Root password, type: password, default: local-dev-only }
  - { id: database, label: Database to create, default: devtoolregistry }
  - { id: tag, label: Version (image tag), default: lts, description: "lts, 11.8, 11.4, latest…" }

source:
  type: docker
  image: mariadb
  tag: ${tag}

install:
  type: docker-pull

run:
  - name: Start MariaDB on localhost:${port}
    type: docker
    ports: ["127.0.0.1:${port}:3306"]
    volumes: ["mariadb-official-data:/var/lib/mysql"]
    env:
      MARIADB_ROOT_PASSWORD: ${password}
      MARIADB_DATABASE: ${database}

links:
  - { label: MariaDB Documentation, url: https://mariadb.org/documentation/ }
  - { label: MariaDB Docker image, url: https://hub.docker.com/_/mariadb }
